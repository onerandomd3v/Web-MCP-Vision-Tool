name: Deploy WebMCP Vision Tool

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webmcp-vision-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Wasp application to Fly.io
    runs-on: ubuntu-latest
    env:
      WASP_VERSION: '0.25'

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install Wasp CLI
        run: npm install --global "@wasp.sh/wasp-cli@${WASP_VERSION}"

      - name: Install Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy client and server
        run: wasp deploy fly deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
