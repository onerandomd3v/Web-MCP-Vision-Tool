# Fly app configuration for the WebMCP Vision server.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webmcp-vision-server'
primary_region = 'ams'

[build]
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
